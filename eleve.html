  <style>
    .student-refresh-actions{align-items:center;margin-bottom:16px}
    .student-refresh-actions #studentRefresh{min-height:48px;padding:11px 20px;background:#f6ad25;border:2px solid #9d5900;color:#172f49;font-size:1rem;font-weight:800;box-shadow:0 3px 0 #9d5900}
    .student-refresh-actions #studentRefresh:hover{background:#ffd06c}
    .student-refresh-actions #studentRefresh:focus-visible{outline:3px solid #164e8b;outline-offset:3px}
    .student-refresh-actions #studentRefresh:disabled{opacity:.7;cursor:wait}
    @media(max-width:600px){.student-refresh-actions #studentRefresh{width:100%}}
    .student-pdf-mount{width:100%;min-width:0;max-width:100%}
    .student-pdf-panel{box-sizing:border-box;width:100%;max-width:100%;min-width:0;overflow:hidden;padding:4px;border:1px solid #9dbde0;border-radius:10px;background:#eaf3ff}
    .student-pdf-controls,.student-pdf-navigation,.student-pdf-zoom,.student-pdf-form-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px}
    .student-pdf-controls,.student-pdf-form-actions{margin-bottom:5px}
    .student-pdf-controls button,.student-pdf-form-actions button{min-height:32px;padding:5px 8px;border:1px solid #8eacd0;border-radius:8px;background:#195a98;color:#fff;font-size:.86rem;font-weight:700;cursor:pointer}
    .student-pdf-controls button:disabled{opacity:.5;cursor:default}
    .student-pdf-form-actions button[aria-pressed=true]{background:#b35c00}
    .student-pdf-zoom output{min-width:46px;text-align:center;font-weight:800;color:#173c61}
    .student-pdf-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .student-pdf-scroll{width:100%;max-height:88svh;overflow:auto;overscroll-behavior:contain}
    .student-pdf-stage{position:relative;margin:0 auto;background:#fff}
    .student-pdf-page{display:block;max-width:none;margin:0;background:#fff;box-shadow:0 2px 12px #1235}
    .student-pdf-text-layer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;user-select:text}
    .student-pdf-text-layer span,.student-pdf-text-layer br{position:absolute;color:transparent;white-space:pre;cursor:text;transform-origin:0 0}
    .student-pdf-text-layer ::selection{background:rgba(30,110,215,.35)}
    .student-pdf-placing{cursor:crosshair}.student-pdf-placing .student-pdf-text-layer,.student-pdf-pen-active .student-pdf-text-layer{pointer-events:none}
    .student-pdf-field-layer{position:absolute;inset:0;pointer-events:none}
    .student-pdf-stroke-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .student-pdf-pen-active{cursor:crosshair;touch-action:none}
    .student-pdf-field{position:absolute;box-sizing:border-box;pointer-events:auto}
    .student-pdf-field textarea{box-sizing:border-box;width:100%;height:100%;min-height:22px;padding:3px;border:1px solid #1774c9;border-radius:3px;background:#fffffff0;color:#102e4b;font:14px Arial,sans-serif;resize:both;user-select:text}
    .student-pdf-cross{display:grid;place-items:center;width:100%;height:100%;min-width:14px;min-height:14px;padding:0;border:0;background:transparent;color:#154f9c;font:bold 19px/1 Arial,sans-serif;cursor:pointer}
    .student-pdf-cross[aria-pressed=false]{color:#6991bb;opacity:.7}
    .student-pdf-move-field,.student-pdf-resize-field{position:absolute;z-index:2;width:19px;height:19px;padding:0;border:1px solid #3973ad;border-radius:4px;background:#eaf4ff;color:#163e65;font-size:13px;line-height:1;cursor:grab;touch-action:none}
    .student-pdf-move-field{left:0;top:-18px}.student-pdf-resize-field{right:-17px;bottom:-17px;cursor:nwse-resize}
    .student-pdf-remove-field{position:absolute;right:-15px;top:-15px;width:23px;height:23px;padding:0;border-radius:50%;background:#a63b22;color:#fff;cursor:pointer}
    .student-pdf-color-label{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#173c61}
    .student-pdf-color-label input{width:42px;height:38px;padding:2px;border:1px solid #8eacd0;border-radius:8px;background:#fff}
    .student-pdf-save-status{font-size:.78rem;color:#173c61}
    @media(max-width:600px){.student-pdf-controls button,.student-pdf-form-actions button{min-height:31px;padding:4px 5px;font-size:.76rem}.student-pdf-zoom output{min-width:40px}}
  </style>

<body class="portal-page">
  <div class="portal-shell">
    <header class="portal-header"><img src="logo-melec-192.webp" alt="Logo BAC PRO MELEC" width="92" height="92"><div><div class="space-title"><h1>BAC PRO MELEC</h1><span class="space-badge">Élève</span></div><p>Consulter les contenus pédagogiques de votre classe.</p></div><a class="portal-top-link" href="./index.html">← Accueil</a></header>
    <main>
      <section id="studentAuth" class="portal-panel portal-auth" aria-labelledby="studentAuthTitle">
        <h2 id="studentAuthTitle">Connexion élève</h2>
        <div class="portal-tabs auth-tabs"><button id="studentLoginTab" class="active" type="button">Se connecter</button><button id="studentSignupTab" type="button">Inscription</button><button id="studentContactTab" type="button">Contacter l’enseignant</button></div>
        <form id="studentLoginForm" class="portal-form">
          <label>Adresse e-mail<input name="email" type="email" autocomplete="username" required></label>
          <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
          <div class="melec-captcha" data-captcha="eleve_connexion" style="min-height:65px;margin:4px 0 8px"></div>
          <button class="portal-button" type="submit">Se connecter</button>
        </form>
        <form id="studentSignupForm" class="portal-form" autocomplete="off" hidden>
          <div class="portal-form-grid"><label>Nom<input name="lastName" maxlength="80" autocomplete="family-name" required></label><label>Prénom<input name="firstName" maxlength="80" autocomplete="given-name" required></label></div>
          <label>Classe demandée<input name="className" maxlength="80" placeholder="Ex. 1MELEC" required></label>
          <label>Adresse e-mail<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
          <label>Mot de passe<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
          <p class="portal-small">Après l’inscription, confirmez votre adresse e-mail. L’enseignant validera ensuite votre classe.</p>
          <div class="melec-captcha" data-captcha="eleve_inscription" style="min-height:65px;margin:4px 0 8px"></div>
          <button class="portal-button" type="submit">Demander mon inscription</button>
        </form>
        <p id="studentAuthStatus" class="form-status" role="status" aria-live="polite"></p>
      </section>
      <section id="studentDashboard" class="portal-panel portal-dashboard" hidden>
        <div class="portal-actions student-refresh-actions"><button id="studentRefresh" type="button" aria-label="Actualiser les TP">↻ Actualiser</button><button id="studentContactButton" class="subtle" type="button">Contacter l’enseignant</button><button id="studentLogout" class="subtle" type="button">Déconnexion</button></div>
        <p id="studentRefreshStatus" class="portal-small" role="status" aria-live="polite"></p>
        <div id="studentProfileStatus" class="portal-message" role="status" aria-live="polite"></div>
        <p id="studentClassName" class="student-class-name" hidden></p>
        <div id="studentContentTabs" class="portal-tabs" hidden><button id="studentTpTab" type="button" class="active">TP en atelier</button></div>
        <section id="studentTpPane" class="student-pane" hidden>
          <h2>TP en atelier</h2><p id="studentTpNotice" class="portal-message" role="status"></p>
          <div id="studentTpList" class="portal-list"></div>
        </section>
      </section>
      <section id="studentContactPanel" class="portal-panel contact-panel" aria-labelledby="contactTitle" hidden>
        <div><p class="eyebrow">Besoin d’aide ?</p><h2 id="contactTitle">Contacter l’enseignant</h2></div>
        <form id="contactForm" class="portal-form" autocomplete="off">
          <div class="portal-form-grid"><label>Nom *<input name="lastName" maxlength="80" autocomplete="off" required></label><label>Prénom *<input name="firstName" maxlength="80" autocomplete="off" required></label><label>Adresse e-mail *<input name="email" type="email" maxlength="254" autocomplete="off" required></label><label>Classe *<input name="className" maxlength="80" autocomplete="off" required></label></div>
          <label>Commentaire *<textarea name="comment" maxlength="500" rows="5" required aria-describedby="contactCount"></textarea></label><span id="contactCount" class="field-help">0 / 500 caractères</span>
          <div class="honeypot" aria-hidden="true"><label>Ne pas remplir ce champ<input name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="portal-button" type="submit">Envoyer le message</button><p id="contactStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>
