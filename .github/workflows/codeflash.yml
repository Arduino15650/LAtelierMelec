name: Codeflash

# Cherche des optimisations de performance dans le code modifié par chaque
# proposition (pull request). Codeflash ouvre ses suggestions sous forme de
# nouvelles propositions à relire : rien n'est fusionné automatiquement.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: codeflash-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  optimize:
    # Ne pas relancer Codeflash sur ses propres propositions.
    if: ${{ github.actor != 'codeflash-ai[bot]' }}
    runs-on: ubuntu-latest
    # Une analyse qui échoue ne bloque jamais une mise en ligne.
    continue-on-error: true
    env:
      CODEFLASH_API_KEY: ${{ secrets.CODEFLASH_API_KEY }}
      CODEFLASH_PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Codeflash
        run: pip install codeflash
      - name: Vérifier les tests
        run: npm test
      # Sur une proposition : seulement le code modifié.
      # Lancement manuel (onglet Actions → Codeflash → Run workflow) : tout le code.
      - name: Lancer Codeflash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            codeflash --all 2>&1 | tee codeflash.log
          else
            codeflash 2>&1 | tee codeflash.log
          fi
      # Affiche le message de Codeflash dans le résumé de l'exécution (onglet Actions).
      - name: Résumé Codeflash
        if: always()
        run: |
          if [ -f codeflash.log ]; then
            { echo '### Codeflash'; echo '```'; tail -n 40 codeflash.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 codeflash.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do [ -n "$l" ] && echo "::notice title=Codeflash::$l"; done
          fi
