# Maintien en éveil de la base Supabase (offre gratuite : un projet inactif est mis en pause).
# Cycle : deux passages par jour, tous les jours, plus un passage à chaque modification de ce fichier.
# Chaque passage écrit un horodatage en base (fonction melec_veille, migration 20261015180000_veille.sql),
# vérifie le service de connexion, puis confirme à GitHub que la tâche reste active
# (GitHub désactive les tâches planifiées d'un dépôt sans activité depuis 60 jours).
# En cas d'échec, GitHub envoie un e-mail au propriétaire du dépôt.
name: Maintien en éveil Supabase

on:
  schedule:
    - cron: "19 7 * * *"
      timezone: Europe/Paris
    - cron: "47 19 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
  # Validate changes to this automation immediately, without a daily commit.
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-daily.yml

permissions: {}

concurrency:
  group: supabase-daily
  cancel-in-progress: false

jobs:
  daily-read:
    if: github.repository == 'Arduino15650/LAtelierMelec'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write
    steps:
      - name: Réveil de la base (écriture d'un horodatage)
        shell: bash
        env:
          SUPABASE_URL: https://bcvhuziwdwaorkxqsrch.supabase.co
          # This is the public key already used by the application, not a secret.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_B95li1RB6XAlzRY7KvmyiA_kgpD1FcW
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' --connect-timeout 10 --max-time 30 \
            --retry 4 --retry-delay 15 --retry-all-errors --retry-max-time 200 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' \
            --header 'Content-Type: application/json' \
            --request POST --data '{}' \
            --output "$response_file" \
            "$SUPABASE_URL/rest/v1/rpc/melec_veille"
          if ! grep -q '"etat": *"ok"' "$response_file"; then
            echo '::error::La base ne renvoie pas la confirmation attendue (projet en pause ?).'
            cat "$response_file"
            exit 1
          fi
          echo "Base active : $(cat "$response_file")"
          # Service de connexion (Auth) : même cycle.
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --output /dev/null "$SUPABASE_URL/auth/v1/health"
          echo 'Connexion (Auth) active.'
          echo "### Supabase actif — $(cat "$response_file")" >> "$GITHUB_STEP_SUMMARY"

      - name: Réactiver
        # Run even if Supabase is temporarily unavailable.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/supabase-daily.yml"
          gh api --method PUT "$endpoint/enable" \
            --header 'X-GitHub-Api-Version: 2022-11-28' --silent
          state="$(gh api "$endpoint" --jq '.state')"
          if [ "$state" != 'active' ]; then
            echo '::error::GitHub ne confirme pas que la tâche est active.'
            exit 1
          fi
          echo 'GitHub confirme que cette tâche est active.'
          echo '### Réactivation GitHub confirmée' >> "$GITHUB_STEP_SUMMARY"
